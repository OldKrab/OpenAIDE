[workspace]
members = ["openaide-rs/android-ssh", "openaide-rs/app-server", "openaide-rs/app-server-protocol", "openaide-rs/remote-client"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
openaide-app-server-protocol = { path = "openaide-rs/app-server-protocol" }
openaide-remote-client = { path = "openaide-rs/remote-client", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.12"
shell-words = "1.1"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
tempfile = "3.23"
# The fork is upstream v3.4.0 with `attach_session` made public, which opening a
# Native Session on a shared Agent process needs.
# TODO: depend on the released crate once upstream exposes `attach_session`.
agent-client-protocol = { git = "https://github.com/OldKrab/rust-sdk", rev = "6ba3746ca40f11c10bf59c1dff983bf11c09e924", features = ["process", "unstable"] }
# The SDK requires this exact schema release; Subagents are behind an unstable feature (ADR-0067).
agent-client-protocol-schema = { version = "=1.12.0", features = ["unstable_subagents"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
fs2 = "0.4"
base64 = "0.23"
ignore = "0.4.27"
notify = "8.2.0"
nucleo-matcher = "0.3.1"
zstd = "0.14"
data-encoding = "2.11"
# Remote Devices reach the App Server by public key (ADR-0062).
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "portmapper"] }
