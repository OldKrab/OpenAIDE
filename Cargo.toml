[workspace]
members = ["openaide-rs/android-ssh", "openaide-rs/app-server", "openaide-rs/app-server-protocol", "openaide-rs/remote-client"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
openaide-app-server-protocol = { path = "openaide-rs/app-server-protocol" }
openaide-remote-client = { path = "openaide-rs/remote-client", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.12"
shell-words = "1.1"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
tempfile = "3.23"
# ACP message types come through the SDK's `v1::schema`, so the SDK's exact schema pin is the only
# one. Its `unstable` feature enables Subagents (ADR-0067).
agent-client-protocol = { version = "5.1.0", features = ["process", "unstable"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
fs2 = "0.4"
base64 = "0.23"
ignore = "0.4.27"
notify = "8.2.0"
nucleo-matcher = "0.3.1"
zstd = "0.14"
data-encoding = "2.11"
# Remote Devices reach the App Server by public key (ADR-0062).
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "portmapper"] }

# Development builds keep line tables for this workspace's crates, so backtraces still
# show file and line, and drop debug info for dependencies. A full `cargo test --no-run`
# shrinks from 6.4 GB to 5.1 GB per build variant, and every branch switch leaves a
# variant behind in `target/`, without changing build time. Debuggers can still step
# through workspace code but cannot inspect local variables; set `debug = true` locally
# when a debugging session needs that.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
