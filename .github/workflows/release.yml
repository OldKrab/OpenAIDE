name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate canonical release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - id: version
        name: Validate version and main ancestry
        shell: bash
        run: |
          version="$(node scripts/release-version.mjs tag "$GITHUB_REF_NAME")"
          git fetch origin main
          commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "Release tag $GITHUB_REF_NAME is not reachable from main" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    name: Require successful CI for release commit
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-release-main-ci.mjs --wait

  artifacts:
    needs: validate
    uses: ./.github/workflows/build-vsix.yml
    secrets: inherit
    with:
      artifacts: all
      version: ${{ needs.validate.outputs.version }}
      enable_windows_updates: true

  github-release:
    name: Publish canonical immutable GitHub release
    needs: [validate, ci, artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read release notes from version commit
        id: release-notes
        shell: bash
        run: |
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          notes_path="$RUNNER_TEMP/release-notes.md"
          git log -1 --format=%B "$commit" > "$notes_path"
          cat >> "$notes_path" <<'EOF'

          ---

          [Privacy policy](https://github.com/OldKrab/OpenAIDE/blob/main/PRIVACY.md) · [Code signing policy](https://github.com/OldKrab/OpenAIDE/blob/main/CODE_SIGNING.md)
          EOF
          echo "path=$notes_path" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vsix-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Require the complete canonical asset set
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for target in linux-x64 win32-x64 darwin-arm64; do
            test -f "release/openaide-vscode-$target-$RELEASE_VERSION.vsix"
          done
          test -f "release/openaide-desktop-windows-x64-$RELEASE_VERSION.exe"
          test -f "release/openaide-desktop-windows-x64-$RELEASE_VERSION.exe.sig"
          test -f "release/openaide-desktop-macos-arm64-$RELEASE_VERSION.dmg"
          test "$(find release -maxdepth 1 -type f -name '*.vsix' | wc -l)" -eq 3
          test "$(find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' \) | wc -l)" -eq 2
      - name: Create draft and attach verified assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: ${{ steps.release-notes.outputs.path }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release/*.vsix
            release/*.exe
            release/*.exe.sig
            release/*.dmg
      - name: Publish the completed draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Require repository immutable releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .immutable)"
          if [[ "$immutable" != "true" ]]; then
            echo "GitHub release is not immutable; enable immutable releases in repository settings" >&2
            exit 1
          fi

  desktop-update-feed:
    name: Publish Windows Desktop update feed
    needs: [validate, github-release]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-win32-x64
          path: release
          merge-multiple: true
      - name: Read immutable release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > release/github-releases.json
          gh release view "v$RELEASE_VERSION" --json body --jq .body > release/release-notes.md
      - name: Generate version-aware Windows feed
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          node scripts/windows-desktop-update-feed.mjs \
            --releases release/github-releases.json \
            --version "$RELEASE_VERSION" \
            --artifact "release/openaide-desktop-windows-x64-$RELEASE_VERSION.exe" \
            --signature "release/openaide-desktop-windows-x64-$RELEASE_VERSION.exe.sig" \
            --notes release/release-notes.md \
            --output release/update-feed
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: release/update-feed
      - name: Deploy immutable release feed
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  marketplace:
    name: Reconcile VS Code Marketplace packages
    if: ${{ !contains(github.ref_name, '-') }}
    needs: [validate, github-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Download canonical GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern '*.vsix' --dir release
      - name: Publish missing packages or verify identical ones
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: node scripts/reconcile-release-registry.mjs marketplace "${{ needs.validate.outputs.version }}" release

  open-vsx:
    name: Reconcile Open VSX packages
    needs: [validate, github-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Download canonical GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern '*.vsix' --dir release
      - name: Publish missing packages or verify identical ones
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: node scripts/reconcile-release-registry.mjs open-vsx "${{ needs.validate.outputs.version }}" release
