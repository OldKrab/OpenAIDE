name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact OpenAIDE version without v (for example 0.0.2-beta.1)"
        type: string
        required: true

permissions:
  actions: read
  contents: read

# A version commit and its tag are one serialized transaction. Never cancel a push midway.
concurrency:
  group: release-version-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Commit and tag release version
    runs-on: ubuntu-24.04
    steps:
      - name: Generate release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The App token lets the pushed tag trigger the separate Release workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.release-token.outputs.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      - name: Require successful CI for the checked-out main commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-release-main-ci.mjs

      - name: Validate release inputs
        id: release-inputs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-version.mjs next "$RELEASE_VERSION"
          notes_path="$RUNNER_TEMP/release-notes.md"
          cp release-notes.md "$notes_path"

          mapfile -t canonical_tags < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .immutable == true) | .tag_name'
          )
          previous_tag=""
          if ((${#canonical_tags[@]} > 0)); then
            previous_tag="$(node scripts/release-version.mjs previous-tag "$RELEASE_VERSION" "${canonical_tags[@]}")"
          fi
          source_changed=true
          if [[ -n "$previous_tag" ]] && git diff --quiet "$previous_tag..HEAD" -- release-notes.md; then
            source_changed=false
          fi
          node scripts/validate-release-notes.mjs \
            "$RELEASE_VERSION" \
            "$notes_path" \
            "$previous_tag" \
            "$source_changed"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The version commit doubles as the GitHub Release body.
      - name: Commit version and tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Stable notes cover changes since the previous stable release; prerelease
          # tags are intentionally not exposed in stable release notes.
          previous_tag="${{ steps.release-inputs.outputs.previous_tag }}"
          notes_path="$RUNNER_TEMP/release-notes.md"

          cp release-notes.md "$notes_path"
          node scripts/update-extension-changelog.mjs "$RELEASE_VERSION" "$notes_path"
          if [[ -n "$previous_tag" ]]; then
            printf '\n## Changelog\n\n**Full Changelog**: %s/%s/compare/%s...v%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous_tag" "$RELEASE_VERSION" >> "$notes_path"
          fi

          npm version "$RELEASE_VERSION" --allow-same-version=false --no-git-tag-version
          git add package.json package-lock.json apps/vscode-extension/CHANGELOG.md
          git commit --file "$notes_path"
          git tag --annotate "v$RELEASE_VERSION" --message "Release v$RELEASE_VERSION"

      - name: Atomically push the version commit and explicit tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v$RELEASE_VERSION"
