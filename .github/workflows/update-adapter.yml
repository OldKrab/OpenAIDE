name: Update embedded adapter

on:
  schedule:
    - cron: "17 6 * * *"
  # A fork dispatches this after CI passes on its main branch; the schedule is the
  # fallback when that dispatch is lost and updates every adapter (ADR-0079).
  workflow_dispatch:
    inputs:
      adapter:
        description: Adapter id from adapters/adapters.json
        required: true
        type: choice
        options:
          - claude-agent-acp
          - codex-acp
      commit:
        description: Full fork commit to embed (defaults to the fork's main branch)
        required: false
        type: string
  # TODO(ADR-0079 PR 3): drop this trigger with update-claude-acp.yml, its only caller.
  workflow_call:
    inputs:
      adapter:
        required: true
        type: string
      commit:
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: Select the adapters to update
    runs-on: ubuntu-24.04
    outputs:
      adapters: ${{ steps.plan.outputs.adapters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          sparse-checkout: adapters/adapters.json
          sparse-checkout-cone-mode: false

      - name: List the adapters
        id: plan
        env:
          REQUESTED: ${{ inputs.adapter }}
        shell: bash
        run: |
          all="$(jq -c '[.adapters[].id]' adapters/adapters.json)"
          if [[ -z "$REQUESTED" ]]; then
            echo "adapters=$all" >> "$GITHUB_OUTPUT"
          elif jq -e --arg id "$REQUESTED" 'index($id) != null' <<< "$all" > /dev/null; then
            echo "adapters=$(jq -cn --arg id "$REQUESTED" '[$id]')" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown adapter $REQUESTED; adapters.json lists $all" >&2
            exit 1
          fi

  update:
    name: Move the ${{ matrix.adapter }} submodule
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJSON(needs.plan.outputs.adapters) }}
    concurrency:
      group: update-adapter-${{ matrix.adapter }}
      cancel-in-progress: false
    steps:
      - name: Generate repository token
        id: repository-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # App-authored pull requests trigger the ordinary CI workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.repository-token.outputs.token }}
          submodules: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Move the submodule and regenerate its runtime lockfile
        id: adapter
        env:
          ADAPTER: ${{ matrix.adapter }}
          ADAPTER_TARGET_COMMIT: ${{ inputs.commit }}
        run: node scripts/update-adapter.mjs "$ADAPTER"

      - name: Check the runtime lockfiles and build the adapters
        if: steps.adapter.outputs.changed == 'true'
        run: |
          npm run adapters:check
          npm run build:adapters

      - name: Set up Rust
        if: steps.adapter.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Verify the launch configuration and managed installation
        if: steps.adapter.outputs.changed == 'true'
        run: cargo test --locked -p openaide-app-server -- agent::acp_agent_config::tests agent::managed_acp_provisioner

      - name: Open the update pull request and merge it on green CI
        if: steps.adapter.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.repository-token.outputs.token }}
          ADAPTER: ${{ matrix.adapter }}
          TARGET_SHORT: ${{ steps.adapter.outputs.short }}
          TARGET_VERSION: ${{ steps.adapter.outputs.version }}
          CURRENT: ${{ steps.adapter.outputs.current }}
          TARGET: ${{ steps.adapter.outputs.target }}
          SUBMODULE: ${{ steps.adapter.outputs.submodule }}
          RUNTIME_PACKAGE: ${{ steps.adapter.outputs.runtime_package }}
          FORK_URL: ${{ steps.adapter.outputs.fork_url }}
        shell: bash
        run: |
          branch="shushakov/update-${ADAPTER}-${TARGET_SHORT}"
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "Pull request #$existing already owns $branch"
            exit 0
          fi

          title="Update ${ADAPTER} to ${TARGET_VERSION} (${TARGET_SHORT})"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add "$SUBMODULE" "$RUNTIME_PACKAGE/package.json" "$RUNTIME_PACKAGE/package-lock.json"
          git diff --cached --check
          git commit --message "$title"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "$title" \
            --body "Moves the embedded ${ADAPTER} submodule to ${FORK_URL#https://github.com/}@${TARGET} (from ${CURRENT}) and regenerates its runtime lockfile. Changes: ${FORK_URL}/compare/${CURRENT}...${TARGET}. The focused launch configuration and managed installation tests passed before this pull request was opened; it merges itself once required CI passes."
          gh pr merge "$branch" --auto --merge
