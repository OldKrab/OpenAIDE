name: Package Web Target

on:
  workflow_call:
    inputs:
      target:
        description: Web App package target
        type: string
        required: true
      version:
        description: Version stamped into the package
        type: string
        required: true
      artifact_suffix:
        description: Suffix isolating non-release artifacts
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  package:
    name: Build and smoke-test ${{ inputs.target }} Web App
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve target contract
        id: target
        shell: bash
        run: |
          case "${{ inputs.target }}" in
            linux-x64)
              echo "server_artifact=app-server-linux-x64-musl" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported Web App target: ${{ inputs.target }}" >&2
              exit 1
              ;;
          esac
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ steps.target.outputs.server_artifact }}${{ inputs.artifact_suffix }}
          path: app-server
      - name: Build the Frontend and server clients
        run: |
          npm run build:typescript-deps
          npm run build --workspace openaide-frontend
      - name: Package Web App archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p artifacts
          node scripts/package-web.mjs app-server/openaide-app-server "$RUNNER_TEMP/stage/openaide-web" "$RELEASE_VERSION"
          tar -czf "artifacts/openaide-web-${{ inputs.target }}-${RELEASE_VERSION}.tar.gz" \
            -C "$RUNNER_TEMP/stage" openaide-web
      - name: Verify packaged content and complete a Task on the packaged server
        shell: bash
        run: |
          # Unpack the published bytes outside the checkout so nothing resolves from the repository.
          extraction_root="$RUNNER_TEMP/openaide-web-${{ inputs.target }}"
          mkdir -p "$extraction_root"
          tar -xzf "artifacts/openaide-web-${{ inputs.target }}-${{ inputs.version }}.tar.gz" -C "$extraction_root"
          node scripts/smoke-release-web.mjs \
            "$extraction_root/openaide-web" \
            "${{ inputs.version }}" \
            tests/smoke/fixtures/test-acp-agent.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-${{ inputs.target }}${{ inputs.artifact_suffix }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
