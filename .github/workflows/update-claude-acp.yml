name: Update Claude ACP

on:
  schedule:
    - cron: "17 6 * * *"
  # The adapter repository dispatches this after each npm publish; the schedule
  # is the fallback when that dispatch is lost.
  workflow_dispatch:
    inputs:
      version:
        description: Exact published version to pin (defaults to the latest npm release)
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: update-claude-acp
  cancel-in-progress: false

jobs:
  update:
    name: Check for a new adapter release
    runs-on: ubuntu-24.04
    steps:
      - name: Generate repository token
        id: repository-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # App-authored pull requests trigger the ordinary CI workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.repository-token.outputs.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Update the exact adapter pin
        id: adapter
        env:
          CLAUDE_ACP_TARGET_VERSION: ${{ inputs.version }}
        run: node scripts/update-claude-acp-version.mjs

      - name: Set up Rust
        if: steps.adapter.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Verify the launch configuration
        if: steps.adapter.outputs.changed == 'true'
        run: cargo test --locked -p openaide-app-server agent::acp_agent_config::tests

      - name: Open the update pull request
        if: steps.adapter.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.repository-token.outputs.token }}
          LATEST_VERSION: ${{ steps.adapter.outputs.latest }}
        shell: bash
        run: |
          branch="shushakov/update-claude-acp-${LATEST_VERSION}"
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "Pull request #$existing already owns $branch"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add packages/app-shell-contracts/src/agentCatalog/claude-acp/package.json
          git diff --cached --check
          git commit --message "Update Claude ACP to $LATEST_VERSION"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update Claude ACP to $LATEST_VERSION" \
            --body "Updates the exact built-in Claude ACP launch pin to the published npm release. The focused launch configuration tests passed before this pull request was opened."
