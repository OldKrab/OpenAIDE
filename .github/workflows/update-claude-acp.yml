name: Update Claude ACP

on:
  schedule:
    - cron: "17 6 * * *"
  # The adapter fork dispatches this after CI passes on its main branch; the
  # schedule is the fallback when that dispatch is lost (ADR-0079).
  workflow_dispatch:
    inputs:
      commit:
        description: Full fork commit to embed (defaults to the fork's main branch)
        required: false
        type: string
      # TODO(ADR-0079 PR 3): remove once the fork dispatches `commit`. Its publish
      # workflow still sends the npm version; the update follows the fork's main.
      version:
        description: Ignored; kept so the fork's current dispatch is accepted
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: update-claude-acp
  cancel-in-progress: false

jobs:
  update:
    name: Move the Claude adapter submodule
    runs-on: ubuntu-24.04
    steps:
      - name: Generate repository token
        id: repository-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # App-authored pull requests trigger the ordinary CI workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.repository-token.outputs.token }}
          submodules: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Move the submodule and regenerate its runtime lockfile
        id: adapter
        env:
          CLAUDE_ACP_TARGET_COMMIT: ${{ inputs.commit }}
        run: node scripts/update-claude-acp.mjs

      - name: Check the runtime lockfile and build the adapter
        if: steps.adapter.outputs.changed == 'true'
        run: |
          npm run adapters:check
          npm run build:adapters

      - name: Set up Rust
        if: steps.adapter.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Verify the launch configuration and managed installation
        if: steps.adapter.outputs.changed == 'true'
        run: cargo test --locked -p openaide-app-server -- agent::acp_agent_config::tests agent::managed_acp_provisioner

      - name: Open the update pull request and merge it on green CI
        if: steps.adapter.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.repository-token.outputs.token }}
          TARGET_SHORT: ${{ steps.adapter.outputs.short }}
          TARGET_VERSION: ${{ steps.adapter.outputs.version }}
          CURRENT: ${{ steps.adapter.outputs.current }}
          TARGET: ${{ steps.adapter.outputs.target }}
        shell: bash
        run: |
          branch="shushakov/update-claude-acp-${TARGET_SHORT}"
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "Pull request #$existing already owns $branch"
            exit 0
          fi

          title="Update Claude ACP to ${TARGET_VERSION} (${TARGET_SHORT})"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add adapters/claude-agent-acp \
            packages/app-shell-contracts/src/agentCatalog/claude-acp/package.json \
            packages/app-shell-contracts/src/agentCatalog/claude-acp/package-lock.json
          git diff --cached --check
          git commit --message "$title"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "$title" \
            --body "Moves the embedded Claude adapter submodule to OldKrab/claude-agent-acp@${TARGET} (from ${CURRENT}) and regenerates its runtime lockfile. Changes: https://github.com/OldKrab/claude-agent-acp/compare/${CURRENT}...${TARGET}. The focused launch configuration and managed installation tests passed before this pull request was opened; it merges itself once required CI passes."
          gh pr merge "$branch" --auto --merge
