name: Update Claude ACP

# The Claude fork's publish workflow still dispatches this file by name with the npm
# `version`. It forwards to the shared adapter update, which follows the fork's main.
# TODO(ADR-0079 PR 3): delete this file once the Claude fork dispatches
# update-adapter.yml with `adapter: claude-agent-acp` and the CI-passing `commit`.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full fork commit to embed (defaults to the fork's main branch)
        required: false
        type: string
      version:
        description: Ignored; kept so the fork's current dispatch is accepted
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  update:
    uses: ./.github/workflows/update-adapter.yml
    with:
      adapter: claude-agent-acp
      commit: ${{ inputs.commit }}
    secrets: inherit
