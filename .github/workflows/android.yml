name: Android APK and Termux runtime

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      OPENAIDE_ANDROID_DEBUG_KEYSTORE:
        required: false
      OPENAIDE_ANDROID_DEBUG_KEYSTORE_PASSWORD:
        required: false
  push:
    branches: [main, 'android/**']
  pull_request:
    paths: ['apps/android/**', 'openaide-rs/android-ssh/**', 'openaide-rs/remote-client/**', '.github/workflows/android.yml']

permissions:
  contents: read

env:
  # The Android App Server archive, named like the other App Server artifacts. Release adds
  # the version to the tarball; the app built from the same commit looks up that name.
  RUNTIME_ARTIFACT: app-server-android-arm64

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: android-browser
      - run: npm ci
      - run: cargo build --locked -p openaide-app-server
      - run: google-chrome --version
      - run: npx playwright install ffmpeg
      - run: npx playwright test task-chat.spec.mjs --grep 'keeps selected images after picker menu dismissal'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        # Diagnostics only: a green run leaves just the installable artifacts.
        if: failure()
        with:
          name: android-browser-diagnostics
          path: test-results/
  version:
    # The version the APK reports, stamped into the Linux App Server test builds carry.
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: read
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
  linux-app-server:
    # A release has already built this artifact in the calling workflow.
    if: ${{ !inputs.release }}
    needs: version
    uses: ./.github/workflows/build-app-server-target.yml
    with:
      target: linux-x64-musl
      version: ${{ needs.version.outputs.version }}
  apk:
    # Test builds carry the App Server built from the same commit, so local work
    # can be tried before the version is published. Releases download the published one.
    needs: [runtime, linux-app-server]
    # The Linux App Server job is skipped in releases, which would skip this job too.
    if: ${{ !cancelled() && needs.runtime.result == 'success' && (inputs.release || needs.linux-app-server.result == 'success') }}
    runs-on: ubuntu-24.04
    # Includes building the SSH client library and its bindings.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: ${{ !inputs.release }}
        with:
          name: ${{ env.RUNTIME_ARTIFACT }}
          path: ${{ runner.temp }}/runtime
      - name: Carry the runtime in test builds
        if: ${{ !inputs.release }}
        run: echo "BUNDLED_RUNTIME=-PopenaideBundledRuntime=$RUNNER_TEMP/runtime/openaide-app-server-android-arm64.tar.gz" >> "$GITHUB_ENV"
      # SSH Computers upload the Linux App Server only if its SHA-256 is built in. The release
      # pins the binary published beside this APK; test builds carry the one from this commit.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: app-server-linux-x64-musl
          path: ${{ runner.temp }}/linux-app-server
      - name: Pin the Linux App Server for SSH Computers
        if: ${{ inputs.release }}
        run: |
          sha="$(openssl dgst -sha256 -r "$RUNNER_TEMP/linux-app-server/openaide-app-server" | cut -d ' ' -f 1)"
          test "${#sha}" -eq 64
          echo "SSH_APP_SERVER=-PopenaideSshAppServerSha256=$sha" >> "$GITHUB_ENV"
      # The SSH client is a Rust library the APK carries.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: android-ssh
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - name: Carry the Linux App Server in test builds
        if: ${{ !inputs.release }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          node scripts/package-app-server-archive.mjs "$RUNNER_TEMP/linux-app-server/openaide-app-server" "$version" "$RUNNER_TEMP/ssh-archive"
          echo "SSH_APP_SERVER=-PopenaideSshAppServerArchive=$RUNNER_TEMP/ssh-archive/openaide-app-server-linux-x64-$version.tar.gz" >> "$GITHUB_ENV"
      - name: Build the Frontend shipped in the APK
        run: |
          npm ci
          npm run build:typescript-deps
          npm run build --workspace openaide-frontend
      - name: Stage the signing key
        id: key
        # Fork pull requests get no secrets and so build no installable APK.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENAIDE_ANDROID_DEBUG_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.OPENAIDE_ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          REQUIRE_SIGNING: ${{ inputs.release }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$REQUIRE_SIGNING" = true ]; then
              echo '::error::Canonical releases require Android signing secrets.'
              exit 1
            fi
            echo '::notice::Android signing secrets are not configured; APKs are signed with a per-runner debug key.'
            exit 0
          fi
          # Every APK built after this step, debug and release, carries the same key.
          umask 077
          keystore="$RUNNER_TEMP/openaide-debug.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "OPENAIDE_ANDROID_KEYSTORE=$keystore"
            echo "OPENAIDE_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo 'staged=true' >> "$GITHUB_OUTPUT"
      # The APKs are named after the release asset openaide-android-VERSION.apk; only the
      # Release workflow adds the version.
      - name: Check and build APKs
        run: |
          gradle -p apps/android --no-daemon $BUNDLED_RUNTIME $SSH_APP_SERVER testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk apps/android/build/openaide-android-debug.apk
      - name: Build user APK
        if: steps.key.outputs.staged == 'true'
        run: |
          gradle -p apps/android --no-daemon $BUNDLED_RUNTIME $SSH_APP_SERVER assembleRelease
          cp apps/android/app/build/outputs/apk/release/app-release.apk apps/android/build/openaide-android.apk
      - name: Remove the signing key
        if: always() && steps.key.outputs.staged == 'true'
        run: rm -f "$OPENAIDE_ANDROID_KEYSTORE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        # Diagnostics only: a green run leaves just the installable artifacts.
        if: failure()
        with:
          name: android-apk-diagnostics
          path: apps/android/app/build/reports/
      # Only the user APK signed with the stable key is published: a per-runner debug key
      # cannot update an installed app.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.key.outputs.staged == 'true'
        with:
          name: android
          path: apps/android/build/openaide-android.apk
          if-no-files-found: error
      # The same APK unzipped, so a phone can install it straight from the artifact link.
      # The artifact takes the file name; Release keeps reading the zipped one above.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.key.outputs.staged == 'true' && !inputs.release
        with:
          path: apps/android/build/openaide-android.apk
          archive: false
          if-no-files-found: error
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Stamp canonical runtime version
        if: inputs.release
        run: node scripts/set-release-artifact-version.mjs "$(node -p 'require("./package.json").version')"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Build Android App Server
        run: |
          sdkmanager 'ndk;27.2.12479018'
          toolchain="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          cargo build --locked --release -p openaide-app-server --target aarch64-linux-android
      - name: Build shared frontend and runtime clients
        run: |
          npm run build:typescript-deps
          node --test apps/android/scripts/install-termux.test.mjs
          node --test apps/android/scripts/setup-ui.test.mjs
          npm exec --workspace openaide-frontend -- vitest run src/components/settings/ConnectionSettings.test.tsx src/components/ContextUsageMobile.test.tsx src/components/UserMessagePicker.test.tsx src/components/useBackNavigation.test.ts
          npm exec -- vitest run packages/app-server-client/src/reliableHttpChannel.test.ts packages/app-server-client/src/reliableBackendConnection.test.ts
          npm exec --workspace openaide-frontend -- vitest run src/services/hostBridge.test.ts
          npm exec --workspace openaide-frontend -- vitest run src/components/ComposerView.test.tsx
          npm run build --workspace openaide-frontend
          npm run test --workspace openaide-web
      - name: Package Termux runtime
        run: |
          node apps/android/scripts/package-runtime.mjs
          chmod +x apps/android/build/runtime/bin/openaide-app-server
          tar -czf apps/android/build/openaide-app-server-android-arm64.tar.gz -C apps/android/build runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.RUNTIME_ARTIFACT }}
          path: apps/android/build/openaide-app-server-android-arm64.tar.gz
          if-no-files-found: error
