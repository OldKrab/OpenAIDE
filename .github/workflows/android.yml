name: Android APK and Termux runtime

on:
  workflow_dispatch:
  push:
    branches: ['android/**']
    paths: ['apps/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: android-browser
      - run: npm ci
      - run: cargo build --locked -p openaide-app-server
      - run: npx playwright install --with-deps chrome
      - run: npx playwright test task-chat.spec.mjs --grep 'keeps selected images after picker menu dismissal'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-browser-checks
          path: test-results/
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENAIDE_ANDROID_DEBUG_KEYSTORE }}
          OPENAIDE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OPENAIDE_ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            export OPENAIDE_ANDROID_KEYSTORE="$RUNNER_TEMP/openaide-debug.p12"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$OPENAIDE_ANDROID_KEYSTORE"
            trap 'rm -f "$OPENAIDE_ANDROID_KEYSTORE"' EXIT
          fi
          gradle -p apps/android --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openaide-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Build Android App Server
        run: |
          sdkmanager 'ndk;27.2.12479018'
          toolchain="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          cargo build --locked --release -p openaide-app-server --target aarch64-linux-android
      - name: Build shared frontend and runtime clients
        run: |
          npm ci
          npm run build:typescript-deps
          npm exec -- vitest run packages/app-server-client/src/reliableHttpChannel.test.ts packages/app-server-client/src/reliableBackendConnection.test.ts
          npm exec --workspace openaide-frontend -- vitest run src/services/hostBridge.test.ts
          npm exec --workspace openaide-frontend -- vitest run src/components/ComposerView.test.tsx
          npm run build --workspace openaide-frontend
          npm run test --workspace openaide-web
      - name: Package Termux runtime
        run: |
          node apps/android/scripts/package-runtime.mjs
          chmod +x apps/android/build/runtime/bin/openaide-app-server
          tar -czf apps/android/build/openaide-termux-arm64.tar.gz -C apps/android/build runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openaide-termux-arm64
          path: apps/android/build/openaide-termux-arm64.tar.gz
          if-no-files-found: error
