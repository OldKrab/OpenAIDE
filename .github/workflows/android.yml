name: Android APK and Termux runtime

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      OPENAIDE_ANDROID_DEBUG_KEYSTORE:
        required: false
      OPENAIDE_ANDROID_DEBUG_KEYSTORE_PASSWORD:
        required: false
  push:
    branches: [main, 'android/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: android-browser
      - run: npm ci
      - run: cargo build --locked -p openaide-app-server
      - run: google-chrome --version
      - run: npx playwright install ffmpeg
      - run: npx playwright test task-chat.spec.mjs --grep 'keeps selected images after picker menu dismissal'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-browser-checks
          path: test-results/
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check and build APKs
        run: gradle -p apps/android --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Build signed user APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENAIDE_ANDROID_DEBUG_KEYSTORE }}
          OPENAIDE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OPENAIDE_ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          REQUIRE_SIGNING: ${{ inputs.release }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            export OPENAIDE_ANDROID_KEYSTORE="$RUNNER_TEMP/openaide-debug.p12"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$OPENAIDE_ANDROID_KEYSTORE"
            trap 'rm -f "$OPENAIDE_ANDROID_KEYSTORE"' EXIT
            gradle -p apps/android --no-daemon assembleRelease
          else
            if [ "$REQUIRE_SIGNING" = true ]; then
              echo '::error::Canonical releases require Android signing secrets.'
              exit 1
            fi
            echo '::notice::Android signing secrets are not configured; only debug APKs are available.'
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openaide-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openaide-android-device-tests
          path: apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openaide-android-reports
          path: apps/android/app/build/reports/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name != 'pull_request'
        with:
          name: openaide-android-user
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Stamp canonical runtime version
        if: inputs.release
        run: node scripts/set-release-artifact-version.mjs "$(node -p 'require("./package.json").version')"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Build Android App Server
        run: |
          sdkmanager 'ndk;27.2.12479018'
          toolchain="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          cargo build --locked --release -p openaide-app-server --target aarch64-linux-android
      - name: Build shared frontend and runtime clients
        run: |
          npm run build:typescript-deps
          node --test apps/android/scripts/install-termux.test.mjs
          node --test apps/android/scripts/setup-ui.test.mjs
          npm exec --workspace openaide-frontend -- vitest run src/components/settings/ConnectionSettings.test.tsx src/components/ContextUsageMobile.test.tsx src/components/UserMessagePicker.test.tsx src/components/useBackNavigation.test.ts
          npm exec -- vitest run packages/app-server-client/src/reliableHttpChannel.test.ts packages/app-server-client/src/reliableBackendConnection.test.ts
          npm exec --workspace openaide-frontend -- vitest run src/services/hostBridge.test.ts
          npm exec --workspace openaide-frontend -- vitest run src/components/ComposerView.test.tsx
          npm run build --workspace openaide-frontend
          npm run test --workspace openaide-web
      - name: Package Termux runtime
        run: |
          node apps/android/scripts/package-runtime.mjs
          chmod +x apps/android/build/runtime/bin/openaide-app-server
          tar -czf apps/android/build/openaide-termux-arm64.tar.gz -C apps/android/build runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openaide-termux-arm64
          path: apps/android/build/openaide-termux-arm64.tar.gz
          if-no-files-found: error
