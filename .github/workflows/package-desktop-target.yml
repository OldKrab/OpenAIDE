name: Package Desktop Target

on:
  workflow_call:
    inputs:
      target:
        description: Desktop package target
        type: string
        required: true
      version:
        description: Version stamped into the package
        type: string
        required: true
      artifact_suffix:
        description: Suffix isolating non-release artifacts
        type: string
        required: false
        default: ""
      enable_windows_updates:
        description: Build Windows with the production updater identity
        type: boolean
        required: false
        default: false
    secrets:
      DESKTOP_UPDATE_RELEASE_PRIVATE_KEY:
        required: false
      DESKTOP_UPDATE_RELEASE_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  package:
    name: Build self-contained ${{ inputs.target }} desktop app
    runs-on: ${{ inputs.target == 'win32-x64' && 'windows-2025' || 'macos-15' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve target contract
        id: target
        shell: bash
        run: |
          case "${{ inputs.target }}" in
            win32-x64)
              {
                echo "binary=openaide-app-server.exe"
                echo "target_triple=x86_64-pc-windows-msvc"
                echo "sidecar_extension=.exe"
                echo "bundle=nsis"
                echo "bundle_directory=nsis"
                echo "extension=exe"
                echo "artifact_platform=windows-x64"
              } >> "$GITHUB_OUTPUT"
              ;;
            darwin-arm64)
              {
                echo "binary=openaide-app-server"
                echo "target_triple=aarch64-apple-darwin"
                echo "sidecar_extension="
                echo "bundle=dmg"
                echo "bundle_directory=dmg"
                echo "extension=dmg"
                echo "artifact_platform=macos-arm64"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported Desktop target: ${{ inputs.target }}" >&2
              exit 1
              ;;
          esac
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Set artifact versions
        run: node scripts/set-release-artifact-version.mjs "${{ inputs.version }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: app-server-${{ inputs.target }}${{ inputs.artifact_suffix }}
          path: app-server
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: inputs.target == 'win32-x64'
        with:
          name: app-server-linux-x64-musl${{ inputs.artifact_suffix }}
          path: wsl-app-server
      - name: Restore App Server executable permission
        if: runner.os != 'Windows'
        run: chmod +x "app-server/${{ steps.target.outputs.binary }}"
      - name: Stage App Server sidecar for Tauri
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp \
            "app-server/${{ steps.target.outputs.binary }}" \
            "apps/desktop/src-tauri/binaries/openaide-app-server-${{ steps.target.outputs.target_triple }}${{ steps.target.outputs.sidecar_extension }}"
      - name: Stage WSL App Server resource for Tauri
        if: inputs.target == 'win32-x64'
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/resources/wsl
          cp wsl-app-server/openaide-app-server apps/desktop/src-tauri/resources/wsl/openaide-app-server
          test "$(od -An -tx1 -N4 apps/desktop/src-tauri/resources/wsl/openaide-app-server | tr -d ' \n')" = "7f454c46"
      - name: Build desktop installer
        shell: bash
        env:
          OPENAIDE_DESKTOP_UPDATE_ENABLED_BUILD: ${{ inputs.target == 'win32-x64' && inputs.enable_windows_updates && '1' || '' }}
          OPENAIDE_DESKTOP_UPDATE_ORIGIN: ${{ inputs.target == 'win32-x64' && inputs.enable_windows_updates && 'https://oldkrab.github.io/OpenAIDE/' || '' }}
          OPENAIDE_DESKTOP_UPDATE_RELEASE_PUBLIC_KEY: ${{ inputs.target == 'win32-x64' && inputs.enable_windows_updates && vars.DESKTOP_UPDATE_RELEASE_PUBLIC_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.target == 'win32-x64' && inputs.enable_windows_updates && secrets.DESKTOP_UPDATE_RELEASE_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.target == 'win32-x64' && inputs.enable_windows_updates && secrets.DESKTOP_UPDATE_RELEASE_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [[ "${{ inputs.target }}" == "win32-x64" && "${{ inputs.enable_windows_updates }}" == "true" ]]; then
            test -n "$OPENAIDE_DESKTOP_UPDATE_RELEASE_PUBLIC_KEY"
            test -n "$TAURI_SIGNING_PRIVATE_KEY"
            test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            updater_build_config="$RUNNER_TEMP/openaide-tauri-updater-key.json"
            node scripts/write-desktop-updater-build-config.mjs \
              "$updater_build_config" \
              "$OPENAIDE_DESKTOP_UPDATE_RELEASE_PUBLIC_KEY"
          fi
          build_args=(
            build
            --ci
            --bundles "${{ steps.target.outputs.bundle }}"
            --config "src-tauri/tauri.release-bundle.conf.json"
          )
          if [[ "${{ inputs.target }}" == "win32-x64" && "${{ inputs.enable_windows_updates }}" == "true" ]]; then
            build_args+=(
              --config "src-tauri/tauri.updater-artifacts.conf.json"
              --config "$updater_build_config"
            )
          fi
          # macOS uses its configured free ad-hoc identity. Update-enabled
          # Windows builds must let Tauri sign the updater artifact, but no
          # Authenticode identity is configured until SignPath is available.
          if [[ "${{ inputs.target }}" == "win32-x64" && "${{ inputs.enable_windows_updates }}" != "true" ]]; then
            build_args+=(--no-sign)
          fi
          npm run tauri --workspace openaide-desktop -- "${build_args[@]}"
      - name: Verify and normalize desktop artifact
        shell: bash
        run: |
          bundled_server="apps/desktop/src-tauri/target/release/${{ steps.target.outputs.binary }}"
          cmp "app-server/${{ steps.target.outputs.binary }}" "$bundled_server"
          source_artifact="$(find \
            "apps/desktop/src-tauri/target/release/bundle/${{ steps.target.outputs.bundle_directory }}" \
            -maxdepth 1 -type f -name '*.${{ steps.target.outputs.extension }}' -print -quit)"
          test -n "$source_artifact"

          if [[ "${{ inputs.target }}" == "darwin-arm64" ]]; then
            mount_root="$RUNNER_TEMP/openaide-desktop-dmg"
            mkdir -p "$mount_root"
            hdiutil attach "$source_artifact" -nobrowse -readonly -mountpoint "$mount_root"
            trap 'hdiutil detach "$mount_root"' EXIT
            packaged_server="$mount_root/OpenAIDE.app/Contents/MacOS/openaide-app-server"
            test -f "$packaged_server"
            # The pre-bundle cmp above proves the sidecar input. Tauri then
            # replaces its linker signature while sealing the app.
            codesign --verify --strict "$packaged_server"
            codesign --verify --deep --strict "$mount_root/OpenAIDE.app"
            codesign --display --verbose=4 "$mount_root/OpenAIDE.app" 2>&1 |
              grep -q '^Signature=adhoc$'
          else
            extraction_root="$RUNNER_TEMP/openaide-desktop-nsis"
            7z x -y "$source_artifact" "-o$extraction_root"
            packaged_server="$(find "$extraction_root" -type f -iname 'openaide-app-server.exe' -print -quit)"
            test -n "$packaged_server"
            cmp app-server/openaide-app-server.exe "$packaged_server"
            packaged_wsl_server="$extraction_root/wsl/openaide-app-server"
            test -f "$packaged_wsl_server"
            cmp wsl-app-server/openaide-app-server "$packaged_wsl_server"
          fi

          mkdir -p artifacts
          cp "$source_artifact" \
            "artifacts/openaide-desktop-${{ steps.target.outputs.artifact_platform }}-${{ inputs.version }}.${{ steps.target.outputs.extension }}"

          if [[ "${{ inputs.target }}" == "win32-x64" && "${{ inputs.enable_windows_updates }}" == "true" ]]; then
            test -f "$source_artifact.sig"
            cp "$source_artifact.sig" \
              "artifacts/openaide-desktop-windows-x64-${{ inputs.version }}.exe.sig"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ inputs.target }}${{ inputs.artifact_suffix }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  windows-smoke:
    name: Smoke-test packaged win32-x64 desktop app
    if: inputs.target == 'win32-x64'
    needs: package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      # A failed smoke retry reuses the uploaded installer instead of recompiling it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-win32-x64${{ inputs.artifact_suffix }}
          path: artifacts
      - name: Extract packaged Windows desktop
        shell: pwsh
        run: |
          $installer = Get-ChildItem artifacts -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not found" }
          $extractionRoot = Join-Path $env:RUNNER_TEMP "openaide-desktop-nsis"
          7z x -y $installer.FullName "-o$extractionRoot"
      - name: Smoke-test packaged Windows Codex ACP launcher
        shell: pwsh
        run: |
          $packagedServer = Get-ChildItem `
            "$env:RUNNER_TEMP/openaide-desktop-nsis" `
            -Filter "openaide-app-server.exe" `
            -Recurse |
            Select-Object -First 1
          if (-not $packagedServer) { throw "Packaged App Server was not found" }
          $serverVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($packagedServer.FullName)
          if ($serverVersion.ProductName -ne "OpenAIDE") {
            throw "Packaged App Server has unexpected ProductName: $($serverVersion.ProductName)"
          }
          if ($serverVersion.FileDescription -ne "OpenAIDE App Server") {
            throw "Packaged App Server has unexpected FileDescription: $($serverVersion.FileDescription)"
          }
          if ($serverVersion.OriginalFilename -ne "openaide-app-server.exe") {
            throw "Packaged App Server has unexpected OriginalFilename: $($serverVersion.OriginalFilename)"
          }
          if ($serverVersion.ProductVersion -ne "${{ inputs.version }}") {
            throw "Packaged App Server version does not match the release: $($serverVersion.ProductVersion)"
          }
          node scripts/smoke-packaged-codex-acp.mjs $packagedServer.FullName $env:GITHUB_WORKSPACE
      - name: Smoke-test packaged Windows desktop startup
        shell: pwsh
        run: |
          $desktopExecutable = Join-Path $env:RUNNER_TEMP "openaide-desktop-nsis/openaide-desktop.exe"
          node scripts/assert-windows-gui-executable.mjs $desktopExecutable
          $desktopVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($desktopExecutable)
          if ($desktopVersion.ProductName -ne "OpenAIDE") {
            throw "Packaged Desktop has unexpected ProductName: $($desktopVersion.ProductName)"
          }
          if ($desktopVersion.ProductVersion -ne "${{ inputs.version }}") {
            throw "Packaged Desktop version does not match the release: $($desktopVersion.ProductVersion)"
          }

          Add-Type -AssemblyName System.Drawing
          $expectedIconPath = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/icons/windows/icon.ico"
          function Assert-AssociatedIconMatches([string] $binaryPath, [string] $iconPath) {
            $expectedIcon = New-Object System.Drawing.Icon($iconPath, 32, 32)
            $actualIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($binaryPath)
            if (-not $actualIcon) { throw "No Windows icon was embedded in $binaryPath" }
            $expectedBitmap = $expectedIcon.ToBitmap()
            $actualBitmap = $actualIcon.ToBitmap()
            try {
              for ($x = 0; $x -lt 32; $x++) {
                for ($y = 0; $y -lt 32; $y++) {
                  if ($expectedBitmap.GetPixel($x, $y).ToArgb() -ne $actualBitmap.GetPixel($x, $y).ToArgb()) {
                    throw "Embedded Windows icon does not match OpenAIDE icon: $binaryPath"
                  }
                }
              }
            } finally {
              $expectedBitmap.Dispose()
              $actualBitmap.Dispose()
              $expectedIcon.Dispose()
              $actualIcon.Dispose()
            }
          }
          Assert-AssociatedIconMatches $desktopExecutable $expectedIconPath
          $installer = Get-ChildItem artifacts -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not found" }
          $expectedInstallerIconPath = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/icons/windows/installer.ico"
          Assert-AssociatedIconMatches $installer.FullName $expectedInstallerIconPath

          $stdout = Join-Path $env:RUNNER_TEMP "openaide-desktop-startup.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "openaide-desktop-startup.stderr.log"
          $process = Start-Process `
            -FilePath $desktopExecutable `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          try {
            if ($process.WaitForExit(10000)) {
              $capturedOutput = (Get-Content $stdout, $stderr -ErrorAction SilentlyContinue) -join "`n"
              throw "Packaged Windows desktop exited during startup with code $($process.ExitCode): $capturedOutput"
            }
          } finally {
            if (-not $process.HasExited) {
              taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
              $global:LASTEXITCODE = 0
            }
          }
