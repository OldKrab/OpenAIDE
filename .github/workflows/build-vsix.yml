name: Build Release Artifacts

on:
  workflow_dispatch:
    inputs:
      artifacts:
        description: Artifact family to build
        type: choice
        options: [all, vsix, desktop]
        default: all
        required: true
      version:
        description: SemVer stamped into artifacts; defaults to package.json plus the commit SHA.
        type: string
        required: false
      vsix_target:
        description: VSIX platform to build
        type: choice
        options: [all, linux-x64, win32-x64, darwin-arm64]
        default: all
        required: true
      desktop_target:
        description: Desktop platform to build
        type: choice
        options: [all, win32-x64, darwin-arm64]
        default: all
        required: true
      enable_windows_updates:
        description: Build Windows with the production updater identity
        type: boolean
        default: false
        required: true
  workflow_call:
    inputs:
      artifacts:
        description: Artifact family to build (all, vsix, or desktop)
        type: string
        default: all
        required: false
      version:
        description: SemVer stamped into artifacts; defaults to package.json plus the commit SHA.
        type: string
        required: false
      vsix_target:
        description: VSIX platform to build (all, linux-x64, win32-x64, or darwin-arm64)
        type: string
        default: all
        required: false
      desktop_target:
        description: Desktop platform to build (all, win32-x64, or darwin-arm64)
        type: string
        default: all
        required: false
      enable_windows_updates:
        description: Build the Windows release with the production updater identity
        type: boolean
        default: false
        required: false
    secrets:
      DESKTOP_UPDATE_RELEASE_PRIVATE_KEY:
        required: false
      DESKTOP_UPDATE_RELEASE_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve artifact graph
    runs-on: ubuntu-24.04
    outputs:
      artifact_suffix: ${{ steps.build.outputs.artifact_suffix }}
      version: ${{ steps.build.outputs.version }}
      server_linux_x64_musl: ${{ steps.build.outputs.server_linux_x64_musl }}
      server_win32_x64: ${{ steps.build.outputs.server_win32_x64 }}
      server_darwin_arm64: ${{ steps.build.outputs.server_darwin_arm64 }}
      vsix_linux_x64: ${{ steps.build.outputs.vsix_linux_x64 }}
      vsix_win32_x64: ${{ steps.build.outputs.vsix_win32_x64 }}
      vsix_darwin_arm64: ${{ steps.build.outputs.vsix_darwin_arm64 }}
      desktop_win32_x64: ${{ steps.build.outputs.desktop_win32_x64 }}
      desktop_darwin_arm64: ${{ steps.build.outputs.desktop_darwin_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Validate selection and resolve artifact version
        id: build
        shell: bash
        env:
          ARTIFACT_SELECTION: ${{ inputs.artifacts }}
          REQUESTED_VERSION: ${{ inputs.version }}
          VSIX_TARGET: ${{ inputs.vsix_target }}
          DESKTOP_TARGET: ${{ inputs.desktop_target }}
        run: |
          if [[ -n "$REQUESTED_VERSION" ]]; then
            version="$REQUESTED_VERSION"
            artifact_suffix=""
          else
            base_version="$(node -p "require('./package.json').version")"
            short_sha="${GITHUB_SHA:0:7}"
            # Manual packages identify their source commit without becoming releases.
            if [[ "$base_version" == *-* ]]; then
              version="${base_version}.g${short_sha}"
            else
              version="${base_version}-g${short_sha}"
            fi
            artifact_suffix="-g${short_sha}"
          fi
          {
            echo "version=$version"
            echo "artifact_suffix=$artifact_suffix"
          } >> "$GITHUB_OUTPUT"
          node scripts/resolve-release-artifact-graph.mjs \
            "$ARTIFACT_SELECTION" \
            "$VSIX_TARGET" \
            "$DESKTOP_TARGET" >> "$GITHUB_OUTPUT"

  server-linux-x64-musl:
    if: needs.prepare.outputs.server_linux_x64_musl == 'true'
    needs: prepare
    uses: ./.github/workflows/build-app-server-target.yml
    with:
      target: linux-x64-musl
      version: ${{ needs.prepare.outputs.version }}
      artifact_suffix: ${{ needs.prepare.outputs.artifact_suffix }}

  server-win32-x64:
    if: needs.prepare.outputs.server_win32_x64 == 'true'
    needs: prepare
    uses: ./.github/workflows/build-app-server-target.yml
    with:
      target: win32-x64
      version: ${{ needs.prepare.outputs.version }}
      artifact_suffix: ${{ needs.prepare.outputs.artifact_suffix }}

  server-darwin-arm64:
    if: needs.prepare.outputs.server_darwin_arm64 == 'true'
    needs: prepare
    uses: ./.github/workflows/build-app-server-target.yml
    with:
      target: darwin-arm64
      version: ${{ needs.prepare.outputs.version }}
      artifact_suffix: ${{ needs.prepare.outputs.artifact_suffix }}

  vsix-linux-x64:
    if: needs.prepare.outputs.vsix_linux_x64 == 'true'
    needs: [prepare, server-linux-x64-musl]
    uses: ./.github/workflows/package-vsix-target.yml
    with:
      target: linux-x64
      version: ${{ needs.prepare.outputs.version }}
      artifact_suffix: ${{ needs.prepare.outputs.artifact_suffix }}

  vsix-win32-x64:
    if: needs.prepare.outputs.vsix_win32_x64 == 'true'
    needs: [prepare, server-win32-x64]
    uses: ./.github/workflows/package-vsix-target.yml
    with:
      target: win32-x64
      version: ${{ needs.prepare.outputs.version }}
      artifact_suffix: ${{ needs.prepare.outputs.artifact_suffix }}

  vsix-darwin-arm64:
    if: needs.prepare.outputs.vsix_darwin_arm64 == 'true'
    needs: [prepare, server-darwin-arm64]
    uses: ./.github/workflows/package-vsix-target.yml
    with:
      target: darwin-arm64
      version: ${{ needs.prepare.outputs.version }}
      artifact_suffix: ${{ needs.prepare.outputs.artifact_suffix }}

  desktop-win32-x64:
    if: needs.prepare.outputs.desktop_win32_x64 == 'true'
    needs: [prepare, server-win32-x64, server-linux-x64-musl]
    uses: ./.github/workflows/package-desktop-target.yml
    with:
      target: win32-x64
      version: ${{ needs.prepare.outputs.version }}
      artifact_suffix: ${{ needs.prepare.outputs.artifact_suffix }}
      enable_windows_updates: ${{ inputs.enable_windows_updates }}
    secrets:
      DESKTOP_UPDATE_RELEASE_PRIVATE_KEY: ${{ secrets.DESKTOP_UPDATE_RELEASE_PRIVATE_KEY }}
      DESKTOP_UPDATE_RELEASE_PRIVATE_KEY_PASSWORD: ${{ secrets.DESKTOP_UPDATE_RELEASE_PRIVATE_KEY_PASSWORD }}

  desktop-darwin-arm64:
    if: needs.prepare.outputs.desktop_darwin_arm64 == 'true'
    needs: [prepare, server-darwin-arm64]
    uses: ./.github/workflows/package-desktop-target.yml
    with:
      target: darwin-arm64
      version: ${{ needs.prepare.outputs.version }}
      artifact_suffix: ${{ needs.prepare.outputs.artifact_suffix }}
      enable_windows_updates: false
