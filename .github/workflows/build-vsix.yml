name: Build Release Artifacts

on:
  workflow_dispatch:
    inputs:
      artifacts:
        description: Artifact family to build
        type: choice
        options: [all, vsix, desktop]
        default: all
        required: true
      version:
        description: SemVer stamped into artifacts; defaults to package.json plus the commit SHA.
        type: string
        required: false
  workflow_call:
    inputs:
      artifacts:
        description: Artifact family to build (all, vsix, or desktop)
        type: string
        default: all
        required: false
      version:
        description: SemVer stamped into artifacts; defaults to package.json plus the commit SHA.
        type: string
        required: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve artifact build
    runs-on: ubuntu-24.04
    outputs:
      artifact_suffix: ${{ steps.build.outputs.artifact_suffix }}
      server_matrix: ${{ steps.build.outputs.server_matrix }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Validate selection and resolve artifact version
        id: build
        shell: bash
        env:
          ARTIFACT_SELECTION: ${{ inputs.artifacts }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          case "$ARTIFACT_SELECTION" in
            all|vsix|desktop) ;;
            *) echo "artifacts must be all, vsix, or desktop" >&2; exit 1 ;;
          esac

          if [[ "$ARTIFACT_SELECTION" == "desktop" ]]; then
            server_matrix='{"include":[{"os":"windows-2025","target":"win32-x64","binary":"openaide-app-server.exe"},{"os":"macos-15","target":"darwin-arm64","binary":"openaide-app-server"}]}'
          else
            server_matrix='{"include":[{"os":"ubuntu-24.04","target":"linux-x64","binary":"openaide-app-server"},{"os":"windows-2025","target":"win32-x64","binary":"openaide-app-server.exe"},{"os":"macos-15","target":"darwin-arm64","binary":"openaide-app-server"}]}'
          fi

          if [[ -n "$REQUESTED_VERSION" ]]; then
            version="$REQUESTED_VERSION"
            artifact_suffix=""
          else
            base_version="$(node -p "require('./package.json').version")"
            short_sha="${GITHUB_SHA:0:7}"
            # Manual packages identify their source commit without becoming releases.
            if [[ "$base_version" == *-* ]]; then
              version="${base_version}.g${short_sha}"
            else
              version="${base_version}-g${short_sha}"
            fi
            artifact_suffix="-g${short_sha}"
          fi
          {
            echo "version=$version"
            echo "artifact_suffix=$artifact_suffix"
            echo "server_matrix=$server_matrix"
          } >> "$GITHUB_OUTPUT"

  app-server:
    name: Build ${{ matrix.target }} App Server
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.server_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Set artifact versions
        run: node scripts/set-release-artifact-version.mjs "${{ needs.prepare.outputs.version }}"
      - name: Test repeated Windows Project persistence
        if: matrix.target == 'win32-x64'
        run: cargo test --locked -p openaide-app-server managed_projects_survive_repeated_catalog_writes
      - name: Build App Server once for both package formats
        run: cargo build --locked --release -p openaide-app-server
      - name: Stage App Server artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp "target/release/${{ matrix.binary }}" artifacts/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-server-${{ matrix.target }}${{ needs.prepare.outputs.artifact_suffix }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  vsix:
    name: Build and smoke-test ${{ matrix.target }} VSIX
    if: inputs.artifacts == 'all' || inputs.artifacts == 'vsix'
    needs: [prepare, app-server]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            binary: openaide-app-server
          - os: windows-2025
            target: win32-x64
            binary: openaide-app-server.exe
          - os: macos-15
            target: darwin-arm64
            binary: openaide-app-server
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Set artifact versions
        run: node scripts/set-release-artifact-version.mjs "${{ needs.prepare.outputs.version }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: app-server-${{ matrix.target }}${{ needs.prepare.outputs.artifact_suffix }}
          path: app-server
      - name: Restore App Server executable permission
        if: runner.os != 'Windows'
        run: chmod +x "app-server/${{ matrix.binary }}"
      - run: npm run build:frontend
      - name: Add extension license
        shell: bash
        run: cp LICENSE apps/vscode-extension/LICENSE
      - name: Package platform VSIX
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts apps/vscode-extension/dist/app-server
          cp "app-server/${{ matrix.binary }}" apps/vscode-extension/dist/app-server/
          cd apps/vscode-extension
          package_args=(
            --target "${{ matrix.target }}"
            --no-dependencies
            --out "../../artifacts/openaide-vscode-${{ matrix.target }}-${RELEASE_VERSION}.vsix"
          )
          # Registry clients use VSIX metadata, not the SemVer suffix, to select the prerelease channel.
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            package_args+=(--pre-release)
          fi
          npm exec -- vsce package "${package_args[@]}"
      - name: Verify packaged content and bundled App Server lifecycle
        shell: bash
        run: |
          extraction_root="$RUNNER_TEMP/openaide-vsix-${{ matrix.target }}"
          unzip -q "artifacts/openaide-vscode-${{ matrix.target }}-${{ needs.prepare.outputs.version }}.vsix" -d "$extraction_root"
          node scripts/smoke-release-vsix.mjs \
            "$extraction_root/extension" \
            "${{ needs.prepare.outputs.version }}" \
            "${{ matrix.target }}" \
            "${{ matrix.binary }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsix-${{ matrix.target }}${{ needs.prepare.outputs.artifact_suffix }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Build self-contained ${{ matrix.target }} desktop app
    if: inputs.artifacts == 'all' || inputs.artifacts == 'desktop'
    needs: [prepare, app-server]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: win32-x64
            target_triple: x86_64-pc-windows-msvc
            binary: openaide-app-server.exe
            sidecar_extension: .exe
            bundle: nsis
            bundle_directory: nsis
            extension: exe
          - os: macos-15
            target: darwin-arm64
            target_triple: aarch64-apple-darwin
            binary: openaide-app-server
            sidecar_extension: ""
            bundle: dmg
            bundle_directory: dmg
            extension: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop-validation/src-tauri
      - run: npm ci
      - name: Set artifact versions
        run: node scripts/set-release-artifact-version.mjs "${{ needs.prepare.outputs.version }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: app-server-${{ matrix.target }}${{ needs.prepare.outputs.artifact_suffix }}
          path: app-server
      - name: Restore App Server executable permission
        if: runner.os != 'Windows'
        run: chmod +x "app-server/${{ matrix.binary }}"
      - name: Stage App Server sidecar for Tauri
        shell: bash
        run: |
          mkdir -p apps/desktop-validation/src-tauri/binaries
          cp \
            "app-server/${{ matrix.binary }}" \
            "apps/desktop-validation/src-tauri/binaries/openaide-app-server-${{ matrix.target_triple }}${{ matrix.sidecar_extension }}"
      - name: Build unsigned desktop installer
        run: >-
          npm run tauri --workspace openaide-desktop-validation --
          build
          --ci
          --no-sign
          --bundles "${{ matrix.bundle }}"
          --config "src-tauri/tauri.release-bundle.conf.json"
      - name: Verify and normalize desktop artifact
        shell: bash
        run: |
          bundled_server="apps/desktop-validation/src-tauri/target/release/${{ matrix.binary }}"
          cmp "app-server/${{ matrix.binary }}" "$bundled_server"
          source_artifact="$(find \
            "apps/desktop-validation/src-tauri/target/release/bundle/${{ matrix.bundle_directory }}" \
            -maxdepth 1 -type f -name '*.${{ matrix.extension }}' -print -quit)"
          test -n "$source_artifact"

          if [[ "${{ matrix.target }}" == "darwin-arm64" ]]; then
            mount_root="$RUNNER_TEMP/openaide-desktop-dmg"
            mkdir -p "$mount_root"
            hdiutil attach "$source_artifact" -nobrowse -readonly -mountpoint "$mount_root"
            trap 'hdiutil detach "$mount_root"' EXIT
            cmp \
              "app-server/openaide-app-server" \
              "$mount_root/OpenAIDE.app/Contents/MacOS/openaide-app-server"
          else
            extraction_root="$RUNNER_TEMP/openaide-desktop-nsis"
            7z x -y "$source_artifact" "-o$extraction_root"
            packaged_server="$(find "$extraction_root" -type f -iname 'openaide-app-server.exe' -print -quit)"
            test -n "$packaged_server"
            cmp "app-server/openaide-app-server.exe" "$packaged_server"
          fi

          mkdir -p artifacts
          cp "$source_artifact" \
            "artifacts/openaide-desktop-${{ matrix.target }}-${{ needs.prepare.outputs.version }}-unsigned.${{ matrix.extension }}"
      - name: Smoke-test packaged Windows Codex ACP launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packagedServer = Get-ChildItem `
            "$env:RUNNER_TEMP/openaide-desktop-nsis" `
            -Filter "openaide-app-server.exe" `
            -Recurse |
            Select-Object -First 1
          if (-not $packagedServer) {
            throw "Packaged App Server was not found"
          }
          node scripts/smoke-packaged-codex-acp.mjs `
            $packagedServer.FullName `
            $env:GITHUB_WORKSPACE
      - name: Smoke-test packaged Windows desktop startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $desktopExecutable = Join-Path $env:RUNNER_TEMP `
            "openaide-desktop-nsis/openaide-desktop-validation.exe"
          node scripts/assert-windows-gui-executable.mjs $desktopExecutable

          $stdout = Join-Path $env:RUNNER_TEMP "openaide-desktop-startup.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "openaide-desktop-startup.stderr.log"
          $process = Start-Process `
            -FilePath $desktopExecutable `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          try {
            if ($process.WaitForExit(10000)) {
              $capturedOutput = (Get-Content $stdout, $stderr -ErrorAction SilentlyContinue) -join "`n"
              throw "Packaged Windows desktop exited during startup with code $($process.ExitCode): $capturedOutput"
            }
          } finally {
            if (-not $process.HasExited) {
              taskkill.exe /PID $process.Id /T /F | Out-Null
            }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.target }}${{ needs.prepare.outputs.artifact_suffix }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
