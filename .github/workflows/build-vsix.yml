name: Build VSIX Artifacts

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: SemVer stamped into packaged artifacts; defaults to package.json for manual runs.
        type: string
        required: false

permissions:
  contents: read

jobs:
  artifacts:
    name: Build and smoke-test ${{ matrix.target }} VSIX
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            binary: openaide-app-server
          - os: windows-2025
            target: win32-x64
            binary: openaide-app-server.exe
          - os: macos-15
            target: darwin-arm64
            binary: openaide-app-server
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: npm ci
      - name: Set artifact versions
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$REQUESTED_VERSION" ]]; then
            version="$REQUESTED_VERSION"
            artifact_name="vsix-${{ matrix.target }}"
          else
            base_version="$(node -p "require('./package.json').version")"
            short_sha="${GITHUB_SHA:0:7}"
            # Manual packages identify their source commit without becoming releases.
            if [[ "$base_version" == *-* ]]; then
              version="${base_version}.g${short_sha}"
            else
              version="${base_version}-g${short_sha}"
            fi
            artifact_name="vsix-${{ matrix.target }}-g${short_sha}"
          fi
          node scripts/set-release-artifact-version.mjs "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - run: cargo build --locked --release -p openaide-app-server
      - run: npm run build:frontend
      - name: Add extension license
        shell: bash
        run: cp LICENSE apps/vscode-extension/LICENSE
      - name: Package platform VSIX
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts apps/vscode-extension/dist/app-server
          cp "target/release/${{ matrix.binary }}" apps/vscode-extension/dist/app-server/
          cd apps/vscode-extension
          package_args=(
            --target "${{ matrix.target }}"
            --no-dependencies
            --out "../../artifacts/openaide-vscode-${{ matrix.target }}-${RELEASE_VERSION}.vsix"
          )
          # Registry clients use VSIX metadata, not the SemVer suffix, to select the prerelease channel.
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            package_args+=(--pre-release)
          fi
          npm exec -- vsce package "${package_args[@]}"
      - name: Verify packaged content and bundled App Server lifecycle
        shell: bash
        run: |
          extraction_root="$RUNNER_TEMP/openaide-vsix-${{ matrix.target }}"
          unzip -q "artifacts/openaide-vscode-${{ matrix.target }}-${{ steps.version.outputs.version }}.vsix" -d "$extraction_root"
          node scripts/smoke-release-vsix.mjs \
            "$extraction_root/extension" \
            "${{ steps.version.outputs.version }}" \
            "${{ matrix.target }}" \
            "${{ matrix.binary }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
