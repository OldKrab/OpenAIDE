name: Build App Server Target

on:
  workflow_call:
    inputs:
      target:
        description: Canonical App Server build target
        type: string
        required: true
      version:
        description: Version stamped into the executable
        type: string
        required: true
      artifact_suffix:
        description: Suffix isolating non-release artifacts
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.target }} App Server
    runs-on: ${{ inputs.target == 'win32-x64' && 'windows-2025' || inputs.target == 'darwin-arm64' && 'macos-15' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Resolve target contract
        id: target
        shell: bash
        run: |
          case "${{ inputs.target }}" in
            linux-x64-musl)
              echo "binary=openaide-app-server" >> "$GITHUB_OUTPUT"
              echo "rust_target=x86_64-unknown-linux-musl" >> "$GITHUB_OUTPUT"
              ;;
            win32-x64)
              echo "binary=openaide-app-server.exe" >> "$GITHUB_OUTPUT"
              echo "rust_target=" >> "$GITHUB_OUTPUT"
              ;;
            darwin-arm64)
              echo "binary=openaide-app-server" >> "$GITHUB_OUTPUT"
              echo "rust_target=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported App Server target: ${{ inputs.target }}" >&2
              exit 1
              ;;
          esac
      - name: Install static Linux build prerequisites
        if: inputs.target == 'linux-x64-musl'
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Set artifact versions
        run: node scripts/set-release-artifact-version.mjs "${{ inputs.version }}"
      - name: Test repeated Windows Project persistence
        if: inputs.target == 'win32-x64'
        run: cargo test --locked -p openaide-app-server --test project_persistence managed_projects_survive_repeated_catalog_writes
      - name: Build App Server once for every target consumer
        shell: bash
        run: |
          if [[ -n "${{ steps.target.outputs.rust_target }}" ]]; then
            cargo build --locked --release -p openaide-app-server --target "${{ steps.target.outputs.rust_target }}"
          else
            cargo build --locked --release -p openaide-app-server
          fi
      - name: Stage App Server artifact
        shell: bash
        run: |
          mkdir -p artifacts
          if [[ -n "${{ steps.target.outputs.rust_target }}" ]]; then
            binary="target/${{ steps.target.outputs.rust_target }}/release/${{ steps.target.outputs.binary }}"
            file "$binary" | grep -q 'static-pie linked'
            if readelf -l "$binary" | grep -q 'INTERP'; then
              echo "Static Linux App Server must not require a dynamic loader" >&2
              exit 1
            fi
            cp "$binary" artifacts/
          else
            cp "target/release/${{ steps.target.outputs.binary }}" artifacts/
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-server-${{ inputs.target }}${{ inputs.artifact_suffix }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
