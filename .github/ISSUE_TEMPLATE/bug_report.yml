name: Bug report
description: Report reproducible OpenAIDE behavior that is incorrect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Diagnostics exports can contain raw prompts, responses, paths, tool output, and secrets. Review the ZIP before uploading it.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.0.1 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: App Shell
      options: [VS Code Extension, Web App]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics bundle
      description: Drag the reviewed ZIP into this field, or use the attachment button. Upload only artifacts you intentionally chose to share.
      placeholder: Attach the openaide-support ZIP here.
