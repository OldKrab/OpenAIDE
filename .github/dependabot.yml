version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One weekly pull request carries every minor and patch update; a major
    # update keeps its own pull request because it needs a review of its own.
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        # The Tauri CLI refuses a build whose npm packages and crates differ in
        # major or minor version, so these move with the Desktop crate instead.
        exclude-patterns:
          - "@tauri-apps/*"
        update-types:
          - minor
          - patch
    ignore:
      # VS Code's 1.x minor versions expose new extension API levels. Keep the
      # types aligned with our declared minimum VS Code version deliberately.
      - dependency-name: "@types/vscode"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # Node type majors represent a runtime generation change. Upgrade them
      # together with the supported Node runtimes instead of independently.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
