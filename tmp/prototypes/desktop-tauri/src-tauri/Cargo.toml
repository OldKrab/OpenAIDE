[package]
name = "openaide-desktop-tauri-prototype"
version = "0.0.0"
description = "Throwaway OpenAIDE Tauri desktop shell spike"
edition = "2024"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
