[package]
name = "openaide-app-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.tauri-winres]
ProductName = "OpenAIDE"
FileDescription = "OpenAIDE App Server"
OriginalFilename = "openaide-app-server.exe"
CompanyName = "OpenAIDE"
LegalCopyright = "Copyright OpenAIDE contributors"

[dependencies]
agent-client-protocol.workspace = true
base64.workspace = true
openaide-app-server-protocol.workspace = true
openaide-remote-core.workspace = true
# The client side, for the gateway the Web App runs (ADR-0082).
openaide-remote-client = { workspace = true, features = ["pairing"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
regex.workspace = true
shell-words.workspace = true
sha2 = "0.11"
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
fs2.workspace = true
ignore.workspace = true
notify.workspace = true
portable-pty = "0.9"
nucleo-matcher.workspace = true
tempfile.workspace = true
zstd.workspace = true
iroh.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = "3.4"
qrcode = { version = "0.14", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "hostname", "process"] }
signal-hook = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp"] }

[build-dependencies]
# The build script verifies staged adapter digests before embedding them (ADR-0079).
serde_json.workspace = true
sha2 = "0.11"

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "=0.3.7"

[dev-dependencies]
# A relay run in the test, for the edge's relay check.
iroh = { workspace = true, features = ["test-utils"] }
# Tests bind on in-memory addresses or on a relay they run.
openaide-remote-core = { workspace = true, features = ["test-network"] }
# Paused time lets deadline contracts run on a controlled clock.
tokio = { workspace = true, features = ["test-util"] }
