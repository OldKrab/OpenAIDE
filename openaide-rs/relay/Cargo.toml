[package]
name = "openaide-relay"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# An Own Relay server (ADR-0085): a small Linux program an operator installs with
# `sudo ./openaide-relay setup`, which admits each person by their own relay key.
[[bin]]
name = "openaide-relay"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
fs2.workspace = true
http = "1"
http-body-util = "0.1"
hyper = "1"
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
iroh-base = { version = "1.4", default-features = false }
iroh-relay = { version = "1.4", features = ["server"] }
nix = { version = "0.31", features = ["net", "user", "fs"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tokio = { workspace = true, features = ["fs", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
url = "2"
x509-parser = "0.18"

[dev-dependencies]
iroh.workspace = true
n0-future = "0.3"
openaide-remote-core.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
tempfile.workspace = true
