[package]
name = "openaide-remote-client"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["pairing"]
# Remote Devices over iroh (ADR-0062).
pairing = ["dep:data-encoding", "dep:iroh", "dep:tokio"]
# Unpacking the published Linux App Server archive for SSH Computers.
release-archive = ["dep:flate2", "dep:sha2", "dep:tar"]

[dependencies]
data-encoding = { workspace = true, optional = true }
flate2 = { version = "1", optional = true }
iroh = { workspace = true, optional = true }
openaide-app-server-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.11", optional = true }
tar = { version = "0.4", optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
