[package]
name = "openaide-remote-client"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["pairing"]
# Remote Devices over iroh (ADR-0062).
pairing = ["dep:data-encoding", "dep:iroh", "dep:openaide-remote-core", "dep:tokio"]
# Unpacking the published Linux App Server archive for SSH Computers.
release-archive = ["dep:flate2", "dep:sha2", "dep:tar"]

[dependencies]
data-encoding = { workspace = true, optional = true }
flate2 = { version = "1", optional = true }
iroh = { workspace = true, optional = true }
openaide-app-server-protocol.workspace = true
openaide-remote-core = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.11", optional = true }
tar = { version = "0.4", optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
# A relay run in the test, for a computer on an Own Relay.
iroh = { workspace = true, features = ["test-utils"] }
# The relay's access control, so a test relay can ask for a password as an Own Relay does.
iroh-relay = { version = "1.4", default-features = false, features = ["server"] }
# The node's tests run App Servers on the in-memory network or on a relay they run.
openaide-remote-core = { workspace = true, features = ["test-network"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
