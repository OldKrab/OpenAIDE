<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>OpenAIDE · Connection</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header>
      <button id="back" class="bar" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button id="info" class="bar" aria-label="About this screen" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/></svg></button>
    </header>
    <main id="page" tabindex="-1"></main>
    <p id="notice" role="status" aria-live="polite" hidden></p>
  </div>
  <div id="sheet" class="sheet" hidden>
    <section role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <span class="grip" aria-hidden="true"></span>
      <h2 id="sheet-title"></h2>
      <div class="sheet-body"></div>
      <button class="secondary sheet-close" type="button">Done</button>
    </section>
  </div>
</body>
</html>
