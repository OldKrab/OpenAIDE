<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenAIDE</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        background: light-dark(oklch(0.975 0.006 255), oklch(0.19 0.008 255));
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: light-dark(oklch(0.975 0.006 255), oklch(0.19 0.008 255));
      }

      .desktop-startup {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            circle at 50% 48%,
            light-dark(rgb(77 156 255 / 10%), rgb(77 156 255 / 13%)) 0,
            transparent 24rem
          ),
          light-dark(oklch(0.975 0.006 255), oklch(0.19 0.008 255));
        user-select: none;
      }

      .desktop-startup-mark {
        position: relative;
        width: 104px;
        height: 104px;
        display: grid;
        place-items: center;
      }

      .desktop-startup-halo {
        position: absolute;
        inset: 12px;
        border-radius: 30px;
        background: rgb(77 156 255 / 22%);
        filter: blur(22px);
        animation: desktop-startup-halo 1.8s ease-in-out infinite;
      }

      .desktop-startup-icon-frame {
        position: relative;
        width: 88px;
        height: 88px;
        overflow: hidden;
        border-radius: 22px;
        filter: drop-shadow(0 12px 22px rgb(26 74 130 / 20%));
      }

      .desktop-startup-icon-frame::after {
        position: absolute;
        inset: -20%;
        background: linear-gradient(
          110deg,
          transparent 30%,
          rgb(255 255 255 / 24%) 48%,
          transparent 66%
        );
        content: "";
        transform: translateX(-115%);
        animation: desktop-startup-shine 2s ease-in-out infinite;
      }

      .desktop-startup-icon {
        display: block;
        width: 100%;
        height: 100%;
      }

      .desktop-startup-label {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes desktop-startup-shine {
        0%, 28% { transform: translateX(-115%); }
        72%, 100% { transform: translateX(115%); }
      }

      @keyframes desktop-startup-halo {
        0%, 100% { opacity: 0.52; transform: scale(0.88); }
        50% { opacity: 0.9; transform: scale(1.06); }
      }

      @media (prefers-reduced-motion: reduce) {
        .desktop-startup-halo,
        .desktop-startup-icon-frame::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body data-shell="desktop">
    <div id="root">
      <main class="desktop-startup" role="status" aria-live="polite">
        <div class="desktop-startup-mark" aria-hidden="true">
          <div class="desktop-startup-halo"></div>
          <div class="desktop-startup-icon-frame">
            <svg class="desktop-startup-icon" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="44" y="44" width="424" height="424" rx="104" fill="#4D9CFF" />
              <g transform="translate(64 64) scale(16)" color="#F7F9FC">
                <path d="M12 2V7M12 17V22M2 12H7M17 12H22" stroke="currentColor" stroke-width="2.75" stroke-linecap="square" stroke-linejoin="bevel" />
                <path d="M4.2 4.2L7.8 7.8M16.2 7.8L19.8 4.2M16.2 16.2L19.8 19.8M7.8 16.2L4.2 19.8" stroke="currentColor" stroke-width="2.75" stroke-linecap="square" stroke-linejoin="bevel" />
                <path d="M12 7L17 12L12 17L7 12L12 7Z" fill="currentColor" />
              </g>
            </svg>
          </div>
        </div>
        <span class="desktop-startup-label">Starting OpenAIDE</span>
      </main>
    </div>
    <script type="module" src="/frontend/main.tsx"></script>
  </body>
</html>
