  <path d="M270 224H390" stroke="#5199F7" stroke-width="5" stroke-linecap="round"/>
  <path d="M374 208L392 224L374 240" fill="none" stroke="#8BC0FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Finder owns the item labels and chooses dark text, so give them one neutral shelf. -->
