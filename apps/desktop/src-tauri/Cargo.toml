[package]
name = "openaide-desktop"
version = "0.0.0"
description = "OpenAIDE Desktop App"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
futures-util = "0.3"
fs2 = "0.4"
reqwest = { version = "0.13.4", default-features = false }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.3"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1", features = ["sync"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
